<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>DataPath Academy — From Data Entry to Data Analysis</title>
    <meta name="description" content="DataPath Academy: a bilingual (Arabic/English) installable learning app that takes you from Data Entry Specialist to Junior Data Analyst." />

    <!-- PWA -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#0a1628" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="DataPath" />
    <link rel="icon" type="image/png" sizes="32x32" href="./icons/icon-32.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />

    <!-- Fonts: Cairo (Arabic UI), Tajawal (Arabic headings), Inter (English) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <style>
      /* In-app loading splash, visible before React mounts */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #0a1628 0%, #0f2440 55%, #123a5e 100%);
        color: #fff;
        font-family: 'Inter', 'Cairo', system-ui, sans-serif;
        transition: opacity 0.45s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      .splash-logo {
        width: 84px; height: 84px; border-radius: 22px;
        background: linear-gradient(135deg, #1e5eff, #06b6d4);
        display: flex; align-items: center; justify-content: center;
        box-shadow: 0 12px 40px rgba(6, 182, 212, 0.35);
      }
      .splash-logo svg { width: 46px; height: 46px; }
      .splash-title { font-size: 22px; font-weight: 800; letter-spacing: 0.5px; }
      .splash-sub { font-size: 12.5px; opacity: 0.75; }
      .splash-bar {
        width: 130px; height: 4px; border-radius: 4px; overflow: hidden;
        background: rgba(255, 255, 255, 0.14); margin-top: 6px;
      }
      .splash-bar::after {
        content: ''; display: block; width: 40%; height: 100%; border-radius: 4px;
        background: linear-gradient(90deg, #06b6d4, #1e5eff);
        animation: splashbar 1.1s ease-in-out infinite;
      }
      @keyframes splashbar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(330%); }
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-logo">
        <svg viewBox="0 0 48 48" fill="none">
          <path d="M8 36 L20 24 L28 30 L40 14" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="40" cy="14" r="4.5" fill="#fff"/>
          <rect x="8" y="40" width="7" height="4" rx="1.5" fill="#a5f3fc"/>
          <rect x="20" y="38" width="7" height="6" rx="1.5" fill="#a5f3fc"/>
          <rect x="32" y="40" width="7" height="4" rx="1.5" fill="#a5f3fc"/>
        </svg>
      </div>
      <div class="splash-title">DataPath Academy</div>
      <div class="splash-sub">From Data Entry to Data Analysis</div>
      <div class="splash-bar"></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
